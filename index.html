<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirement Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Top bar -->
    <header class="app-header">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-mark">RS</div>
            <div>
                <div class="logo-text">Requirement Studio</div>
            </div>
        </div>

        <!-- Centre controls -->
        <div class="header-controls">
            <div class="header-control-group">
                <span class="header-control-label">Discipline</span>
                <!-- Populated at startup from the Disciplines registry — see main.js -->
                <select id="disciplineSelect"></select>
            </div>
            <div class="header-control-group">
                <span class="header-control-label">Class</span>
                <select id="docClassSelect"
                        title="Document size class. Sets the per-discipline requirement budgets; the resolved limits are shown in the right-pane Requirement Budget panel.">
                    <option value="simple">Simple</option>
                    <option value="medium">Medium</option>
                    <option value="advanced">Advanced</option>
                    <option value="complex" selected>Complex</option>
                </select>
            </div>
        </div>

        <!-- Project name pill (absolutely centred in the header). Text and
             named/unnamed state are set on boot, load and save by main.js. -->
        <span id="projectNamePill" class="project-name-pill unnamed" title="Project name — set when you save">untitled</span>

        <!-- Right-side actions -->
        <div class="header-actions">
            <button id="toggleLeftPane" class="btn-pane-toggle"
                title="Show/hide the outline pane">☰ Outline</button>
            <button id="toggleRightPane" class="btn-pane-toggle"
                title="Show/hide the model summary pane">Summary ☰</button>

            <input type="file" id="loadJsonInput" accept=".json" style="display:none;">
            <div id="topBarActions" class="header-actions hidden">
                <button id="exportTxtButton" class="btn-hd btn-hd-outline">Export TXT</button>
                <button id="exportPdfButton" class="btn-hd btn-hd-outline">Export PDF</button>
                <button id="loadJsonButton"  class="btn-hd btn-hd-outline">Load Project</button>
                <button id="saveJsonButton"  class="btn-hd btn-hd-primary">Save Project</button>
            </div>

            <span class="app-version" title="Application version">v1.6.5</span>
        </div>
    </header>

    <!-- Three-pane layout -->
    <div class="three-pane-container">
        <!-- Left pane: outline -->
        <aside id="leftPane" class="pane pane-left">
            <div class="pane-header">
                <h6 class="mb-0">Document Outline</h6>
                <span id="budgetCounter" class="budget-badge" title="Completeness of the selected discipline">0 %</span>
            </div>
            <div id="outlineContainer" class="pane-body"></div>
        </aside>

        <!-- Center pane: document/editor -->
        <main id="centerPane" class="pane pane-center">
            <div id="chapterPaneHeader" class="pane-header d-none">
                <h6 id="chapterTitle" class="mb-0">Select a chapter</h6>
                <span id="chapterCompleteness" class="count-badge">—</span>
            </div>
            <div id="editorContainer" class="pane-body"></div>
        </main>

        <!-- Right pane: live summary -->
        <aside id="rightPane" class="pane pane-right">
            <div class="pane-header">
                <h6 class="mb-0">Model Summary</h6>
            </div>
            <div id="summaryContainer" class="pane-body"></div>
        </aside>
    </div>

    <!--
        Scripts in dependency order. The order tells the story —
        registries first, then the data they hold, then the UI that
        consumes them.

          1. Pure utility libs
          2. Domain model (data classes)
          3. Three registries (discipline, chapter, declaration)
          4. Declaration kinds — each registers itself into Declarations
          5. Disciplines — each registers itself into Disciplines
          6. Chapter files — each registers itself into Chapters
          7. UI helpers used by the editor frame
          8. Editor / outline / summary views
          9. Persistence + export
         10. main.js bootstraps the app
    -->

    <!-- 1. Pure utility libs -->
    <script src="grammar.js"></script>
    <script src="timing.js"></script>
    <script src="tooltip.js"></script>
    <script src="ui_widgets.js"></script>

    <!-- 2. Domain model -->
    <script src="model_base.js"></script>

    <!-- 3. Registries -->
    <script src="discipline_registry.js"></script>
    <script src="chapter_registry.js"></script>
    <script src="declaration_registry.js"></script>

    <!-- 4. Declaration kinds (self-register into Declarations) -->
    <script src="declarations/element.js"></script>
    <script src="declarations/hwComponent.js"></script>
    <script src="declarations/swUnit.js"></script>
    <script src="declarations/interface.js"></script>
    <script src="declarations/internalInterface.js"></script>
    <script src="declarations/mode.js"></script>
    <script src="declarations/modeTransition.js"></script>
    <script src="declarations/safetyActor.js"></script>
    <script src="declarations/itemFunction.js"></script>
    <script src="declarations/safetyGoal.js"></script>
    <script src="declarations/safeState.js"></script>
    <script src="declarations/assumption.js"></script>
    <script src="declarations/failureMode.js"></script>
    <script src="declarations/hsiSignal.js"></script>

    <!-- 5. Disciplines (self-register into Disciplines) -->
    <script src="disciplines/system.js"></script>
    <script src="disciplines/item.js"></script>
    <script src="disciplines/hardware.js"></script>
    <script src="disciplines/software.js"></script>

    <!-- 6a. System chapters (self-register into Chapters under 'system').
            Order in this list does not matter — Chapters.register sorts
            by spec.order on insertion. We list them in document order
            so the file system reflects the document. -->
    <script src="disciplines/system/front_matter.js"></script>
    <script src="disciplines/system/ch01_scope.js"></script>
    <script src="disciplines/system/ch02_item.js"></script>
    <script src="disciplines/system/ch03_sg.js"></script>
    <script src="disciplines/system/ch05_acceptance.js"></script>
    <script src="disciplines/system/ch06_breakdown.js"></script>
    <script src="disciplines/system/ch07_elements.js"></script>
    <script src="disciplines/system/ch09_hsi.js"></script>
    <script src="disciplines/system/ch_timing.js"></script>
    <script src="disciplines/system/ch12_safety_analyses.js"></script>
    <script src="disciplines/system/ch13_calibration.js"></script>
    <script src="disciplines/system/ch14_env.js"></script>
    <script src="disciplines/system/ch15_cyber.js"></script>
    <script src="disciplines/system/ch16_hmi.js"></script>
    <script src="disciplines/system/ch17_assumptions.js"></script>
    <script src="disciplines/system/ch18_lifecycle.js"></script>
    <script src="disciplines/system/ch19_verif.js"></script>
    <script src="disciplines/system/ch20_trace.js"></script>

    <!-- 6b. Item chapters -->
    <script src="disciplines/item/front_matter.js"></script>
    <script src="disciplines/item/ch02_item.js"></script>
    <script src="disciplines/item/hara.js"></script>
    <script src="disciplines/item/fsc.js"></script>
    <script src="disciplines/item/verification.js"></script>
    <script src="disciplines/item/assumptions.js"></script>

    <!-- 6c. Hardware chapters (HW Requirements Specification — HWE.1 / ISO 26262-5:6) -->
    <script src="disciplines/hardware/front_matter.js"></script>
    <script src="disciplines/hardware/hw_inputs.js"></script>
    <script src="disciplines/hardware/hw_functional.js"></script>
    <script src="disciplines/hardware/hw_interface.js"></script>
    <script src="disciplines/hardware/hw_safety_reqs.js"></script>
    <script src="disciplines/hardware/hw_resource.js"></script>
    <script src="disciplines/hardware/hw_reliability.js"></script>
    <script src="disciplines/hardware/hw_assumptions.js"></script>
    <script src="disciplines/hardware/hw_verification.js"></script>

    <!-- 6d. Software chapters (SW Requirements Specification — SWE.1 / ISO 26262-6:6) -->
    <script src="disciplines/software/front_matter.js"></script>
    <script src="disciplines/software/sw_inputs.js"></script>
    <script src="disciplines/software/sw_functional.js"></script>
    <script src="disciplines/software/sw_interface.js"></script>
    <script src="disciplines/software/sw_safety_reqs.js"></script>
    <script src="disciplines/software/sw_resource.js"></script>
    <script src="disciplines/software/sw_config_calibration.js"></script>
    <script src="disciplines/software/sw_operational.js"></script>
    <script src="disciplines/software/sw_assumptions.js"></script>
    <script src="disciplines/software/sw_verification.js"></script>

    <!-- 7. UI helpers used by the editor frame -->
    <script src="ui/welcome_panel.js"></script>
    <script src="ui/datalists.js"></script>
    <script src="ui/declaration_table.js"></script>
    <script src="ui/checklist.js"></script>

    <!-- 8. Editor / outline / summary views -->
    <script src="ui_outline.js"></script>
    <script src="ui_editor.js"></script>
    <script src="ui_summary.js"></script>

    <!-- 9. Cross-cutting concerns -->
    <script src="validator.js"></script>
    <script src="persistence.js"></script>
    <script src="export.js"></script>

    <!-- 10. Bootstrap -->
    <script src="main.js"></script>
</body>
</html>
